CONFIG_STATIC_INIT_GNU=y

# Sidewalk
CONFIG_SIDEWALK=y
CONFIG_SMF=y
# No DFU: the sample has no bootloader
CONFIG_SIDEWALK_DFU=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_STATE_NOTIFIER=n

# Stack and Heap
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MBEDTLS_HEAP_SIZE=4096

# No logs, console, shell or UART: they draw current between location runs
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_ASSERT_NO_FILE_INFO=y

# Power Management
CONFIG_PM_DEVICE=y

